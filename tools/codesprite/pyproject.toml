[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesprite"
version = "0.1.0"
description = "Compiled-sprite generator for the SAM Coupé (mode 4) Z80"
requires-python = ">=3.10"
dependencies = ["pillow>=9"]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6"]

[project.scripts]
codesprite = "codesprite.cli:main"

[tool.setuptools.packages.find]
include = ["codesprite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
